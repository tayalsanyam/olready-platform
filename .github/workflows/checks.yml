name: Checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: olready_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/olready_test
      DATABASE_URL: postgres://postgres@localhost:5432/olready_test
      MKT_PLACE_STATES: '04,03,06,07'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
